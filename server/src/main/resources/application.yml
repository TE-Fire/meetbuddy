server:
  # 8099 是全项目约定端口：run-local.sh、Flutter（lib/config/env.dart）、
  # 小程序（config/env.js）、docs 全部指 8099。
  # 别在此处写其它值——脚本启动时它会被 run-local.sh 的 --server.port 覆盖，
  # 但「从 IDE 直接 Run MeetbuddyApplication」时会原样生效，客户端便全部连不上。
  # 留环境变量位只为临时换端口；命令行参数优先级仍高于这里。
  port: ${MEETBUDDY_SERVER_PORT:8099}

spring:
  application:
    name: meetbuddy-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # characterEncoding 只能填 Java 的字符集名（UTF-8），填 utf8mb4 会抛
    # "Unsupported character encoding 'utf8mb4'，这是 Connector/J 的一个常见坑
    url: "jdbc:mysql://127.0.0.1:3306/meetbuddy?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: root
    # 口令一律由环境变量注入，仓库不留明文、也不给默认值。
    # ⚠ 漏配时**不会**报“占位符无法解析”：@ConfigurationProperties 绑定走的是
    #   PropertySourcesPlaceholdersResolver(ignoreUnresolvablePlaceholders=true)，
    #   解析不到就原样保留字面量。也就是把 "${MYSQL_PASSWORD}" 这 17 个字符当口令
    #   发给了 MySQL，现象是 Access denied for user 'root'@'localhost'
    #   (using password: YES) —— 极易误判成“口令写错了”。
    #   （实测：Binder 绑定未解析占位符返回的正是字面量本身。）
    # 本地开发用 server/run-local.sh，它读被 gitignore 的 server/.env.local；
    # 从 IDE 直接 Run 时，靠 .vscode/launch.json 的 envFile 指到同一个文件。
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: 127.0.0.1
      # 本机的 Redis 3.0.504（6379）不支持 GEO，M3 起改用 Docker 里的 redis:7.2.3，宿主端口 6380
      # 见 server/docker/README.md。变量名带 MEETBUDDY_ 前缀，避免被外部环境里同名的
      # REDIS_PORT 覆盖掉（沙箱曾自动注入过 SERVER_PORT，端口类变量名要防一手）
      port: ${MEETBUDDY_REDIS_PORT:6380}
      # 本地开发用 Docker 里的 redis:7.2.3（见 server/docker），刻意不设密码——
      # 本机单开发者、封闭网络，无密码需求；docker 容器与 Spring 两侧都不带密码最省事。
      database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

meetbuddy:
  cors:
    # 允许跨域的来源。开发期 Flutter Web 预览的端口是随机的，所以按 localhost 通配；
    # 上线前改成正式前端域名（可逗号分隔多个）。见 WebMvcConfig#addCorsMappings
    allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*
  signup:
    # 报名是否走 Redis 分布式锁。关掉可复现超卖，用于 M7 的"有锁/无锁"对照实验；
    # 除压测外必须保持 true
    lock-enabled: true
  jwt:
    # HMAC-SHA256 要求密钥不少于 32 字节，改短会在启动时直接报错
    secret: meetbuddy-local-dev-secret-please-change-before-release-0001
    access-ttl-seconds: 7200
    refresh-ttl-seconds: 604800
  dev:
    # 默认关闭——不带 profile 启动走的是生产语义，验证码真随机。
    # 本地开发由 application-dev.yml 覆盖为 true（run-local.sh 默认激活 dev）。
    fixed-code-enabled: false
    fixed-code: "123456"

logging:
  level:
    com.tefire.meetbuddy: debug
