server:
  port: 8080

spring:
  application:
    name: meetbuddy-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # characterEncoding 只能填 Java 的字符集名（UTF-8），填 utf8mb4 会抛
    # "Unsupported character encoding 'utf8mb4'，这是 Connector/J 的一个常见坑
    url: "jdbc:mysql://127.0.0.1:3306/meetbuddy?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: root
    # 口令一律由环境变量注入，仓库不留明文、也不给默认值：
    # 漏配时启动直接报 "Could not resolve placeholder 'MYSQL_PASSWORD'"，比连不上库更好定位。
    # 本地开发用 server/run-local.sh，它读被 gitignore 的 server/.env.local。
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: 127.0.0.1
      # 本机的 Redis 3.0.504（6379）不支持 GEO，M3 起改用 Docker 里的 redis:7.2.3，宿主端口 6380
      # 见 server/docker/README.md。变量名带 MEETBUDDY_ 前缀，避免被外部环境里同名的
      # REDIS_PORT 覆盖掉（沙箱曾自动注入过 SERVER_PORT，端口类变量名要防一手）
      port: ${MEETBUDDY_REDIS_PORT:6380}
      # 同上，不写默认值，由 .env.local / 环境变量注入
      password: ${MEETBUDDY_REDIS_PASSWORD}
      database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

meetbuddy:
  signup:
    # 报名是否走 Redis 分布式锁。关掉可复现超卖，用于 M7 的"有锁/无锁"对照实验；
    # 除压测外必须保持 true
    lock-enabled: true
  jwt:
    # HMAC-SHA256 要求密钥不少于 32 字节，改短会在启动时直接报错
    secret: meetbuddy-local-dev-secret-please-change-before-release-0001
    access-ttl-seconds: 7200
    refresh-ttl-seconds: 604800
  dev:
    # 默认关闭——不带 profile 启动走的是生产语义，验证码真随机。
    # 本地开发由 application-dev.yml 覆盖为 true（run-local.sh 默认激活 dev）。
    fixed-code-enabled: false
    fixed-code: "123456"

logging:
  level:
    com.tefire.meetbuddy: debug
